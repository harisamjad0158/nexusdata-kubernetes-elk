apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: nexusdata
  labels: {app: logstash, app.kubernetes.io/part-of: nexusdata}
spec:
  selector: {app: logstash}
  ports:
    - {name: http-ingest, port: 5044, targetPort: 5044}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: nexusdata
  labels: {app: logstash, app.kubernetes.io/part-of: nexusdata}
spec:
  replicas: 1
  selector:
    matchLabels: {app: logstash}
  template:
    metadata:
      labels: {app: logstash, app.kubernetes.io/part-of: nexusdata}
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.1
          env:
            - {name: LS_JAVA_OPTS, value: '-Xms256m -Xmx256m'}
            - {name: ES_USERNAME, value: elastic}
            - {name: ES_PASSWORD, valueFrom: {secretKeyRef: {name: nexusdata-credentials, key: elastic-password}}}
            - {name: XPACK_MONITORING_ENABLED, value: 'false'}
          ports:
            - {name: http-ingest, containerPort: 5044}
            - {name: api, containerPort: 9600}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: 500m, memory: 768Mi}
          readinessProbe:
            tcpSocket: {port: 5044}
            initialDelaySeconds: 35
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 5044
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /, port: 9600}
            initialDelaySeconds: 90
            periodSeconds: 20
          volumeMounts:
            - {name: pipeline, mountPath: /usr/share/logstash/pipeline, readOnly: true}
            - {name: certs, mountPath: /usr/share/logstash/config/certs, readOnly: true}
      volumes:
        - name: pipeline
          configMap: {name: logstash-pipeline}
        - name: certs
          secret: {secretName: nexusdata-tls, defaultMode: 0444}

apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: nexusdata
  labels: {app: kibana, app.kubernetes.io/part-of: nexusdata}
spec:
  selector: {app: kibana}
  ports:
    - {name: http, port: 5601, targetPort: 5601}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: nexusdata
  labels: {app: kibana, app.kubernetes.io/part-of: nexusdata}
spec:
  replicas: 1
  selector:
    matchLabels: {app: kibana}
  template:
    metadata:
      labels: {app: kibana, app.kubernetes.io/part-of: nexusdata}
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.11.1
          env:
            - {name: ELASTICSEARCH_HOSTS, value: 'https://es-http.nexusdata.svc.cluster.local:9200'}
            - {name: ELASTICSEARCH_USERNAME, value: kibana_system}
            - {name: ELASTICSEARCH_PASSWORD, valueFrom: {secretKeyRef: {name: nexusdata-credentials, key: kibana-password}}}
            - {name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES, value: /usr/share/kibana/config/certs/ca.crt}
            - {name: SERVER_HOST, value: '0.0.0.0'}
            - {name: NODE_OPTIONS, value: '--max-old-space-size=512'}
          ports:
            - {name: http, containerPort: 5601}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: 500m, memory: 768Mi}
          readinessProbe:
            httpGet: {path: /api/status, port: 5601}
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 15
          livenessProbe:
            tcpSocket: {port: 5601}
            initialDelaySeconds: 90
            periodSeconds: 20
          volumeMounts:
            - {name: certs, mountPath: /usr/share/kibana/config/certs, readOnly: true}
      volumes:
        - name: certs
          secret: {secretName: nexusdata-tls, defaultMode: 0444}
